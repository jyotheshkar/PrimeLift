name: Demo artifact checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  artifact-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate saved synthetic-demo reports
        run: python scripts/validate_demo_artifacts.py
      - name: Check backend Python syntax without importing dependencies
        run: python -m compileall -q backend scripts
